name: Static regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js
      - name: Check static shell and protected regressions
        run: node scripts/check-static.mjs
