<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="本地优先的个人训练记录 PWA" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>训练记录</title>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>训练记录</h1>
      <p class="muted">数据仅保存在当前设备浏览器</p>
    </div>
    <button id="installBtn" class="secondary hidden">安装</button>
  </header>

  <main>
    <section id="today" class="page active">
      <div class="card">
        <div class="row between">
          <div>
            <h2>今日训练</h2>
            <p id="todayDate" class="muted"></p>
          </div>
          <select id="planSelect" aria-label="选择训练计划"></select>
        </div>
      </div>

      <div id="workoutContainer"></div>

      <div class="card sticky-actions">
        <button id="saveWorkoutBtn">保存本次训练</button>
        <button id="resetWorkoutBtn" class="secondary">清空本次输入</button>
      </div>
    </section>

    <section id="history" class="page">
      <div class="card">
        <h2>历史记录</h2>
        <div id="historyList"></div>
      </div>
    </section>

    <section id="progress" class="page">
      <div class="card">
        <h2>进步趋势</h2>
        <label>动作
          <select id="progressExercise"></select>
        </label>
        <canvas id="progressChart" width="800" height="360"></canvas>
        <p id="progressSummary" class="muted"></p>
      </div>
      <div class="card">
        <h3>身体数据</h3>
        <div class="grid2">
          <label>体重 kg<input id="bodyWeight" type="number" step="0.1" inputmode="decimal"></label>
          <label>胸围 cm<input id="chestCirc" type="number" step="0.1" inputmode="decimal"></label>
          <label>腰围 cm<input id="waistCirc" type="number" step="0.1" inputmode="decimal"></label>
          <label>上臂围 cm<input id="armCirc" type="number" step="0.1" inputmode="decimal"></label>
        </div>
        <button id="saveBodyBtn">保存身体数据</button>
        <div id="bodyHistory"></div>
      </div>
    </section>

    <section id="settings" class="page">
      <div class="card">
        <h2>数据与隐私</h2>
        <p>训练记录、身体数据和计划保存在本机 IndexedDB。此应用没有分析统计、广告、第三方 SDK 或云端数据库。</p>
        <div class="stack">
          <button id="exportBtn">导出备份 JSON</button>
          <label class="file-btn">导入备份 JSON
            <input id="importInput" type="file" accept="application/json,.json">
          </label>
          <button id="wipeBtn" class="danger">删除本机全部数据</button>
        </div>
      </div>

      <div class="card">
        <h3>训练计划</h3>
        <p class="muted">第一版通过导入 JSON 建立计划。这样公开部署的网页代码里不会出现你的真实重量和身体数据。</p>
      </div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button data-page="today" class="active">训练</button>
    <button data-page="history">历史</button>
    <button data-page="progress">趋势</button>
    <button data-page="settings">设置</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
